<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BoldFrame Studios</title>
    <meta
      name="description"
      content="BoldFrame Studios brings strategy, design and frontend development together to make thoughtful, distinctive websites."
    />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="BoldFrame Studios — Digital design & development" />
    <meta
      property="og:description"
      content="Strategy, design and frontend development for distinctive websites."
    />
    <meta property="og:image" content="/p1.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boldframestudios.in/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BoldFrame Studios" />
    <meta
      name="twitter:description"
      content="Thoughtful, distinctive websites by BoldFrame Studios."
    />
    <meta name="twitter:image" content="/p1.webp" />

    <!-- Theme Color (browser UI color) -->
    <meta name="theme-color" content="#f2eee4" />

    <!-- Keywords (optional, minor impact) -->
    <meta
      name="keywords"
      content="web design agency, frontend development, React motion, UI UX design, Vite, BoldFrame Studios"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://boldframestudios.in/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png.png">

    <!-- Fonts: preconnect + preload stylesheet for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
