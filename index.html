<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />

    <title>BoldFrame Studios</title>
    <meta
      name="description"
      content="BoldFrame Studios is a design and development studio. We understand your problem end to end, research your market and brand, plan the product, and build secure, fast websites and web apps."
    />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="BoldFrame Studios — Creative Web Design & Motion Development Agency" />
    <meta
      property="og:description"
      content="BoldFrame Studios: research, design and development for secure, fast websites and web apps."
    />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boldframestudios.in/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BoldFrame Studios" />
    <meta
      name="twitter:description"
      content="BoldFrame Studios: research, design and development for secure, fast websites and web apps."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- Theme Color (browser UI color) -->
    <meta name="theme-color" content="#F4F8FF" />

    <!-- Keywords (optional, minor impact) -->
    <meta
      name="keywords"
      content="web design, web development, web apps, e-commerce, UI UX design, product development, React, BoldFrame Studios"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://boldframestudios.in/" />

    <!-- Anton (the hero wordmark) is self-hosted and preloaded: the intro
         waits for it, so it must arrive early. -->
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Intro mode, decided before first paint so the hero never flashes:
         full (first visit this session), short (repeat), none (reduced motion) -->
    <script>
      (function () {
        var mode = 'none';
        try {
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            mode = sessionStorage.getItem('bf-loader-seen') === '1' ? 'short' : 'full';
            sessionStorage.setItem('bf-loader-seen', '1');
          }
        } catch (e) { mode = 'short'; }
        document.documentElement.setAttribute('data-intro', mode);
        // No pinch-zoom on iOS (Safari ignores user-scalable=no).
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        if (mode !== 'none') document.documentElement.classList.add('bfx-loading');
      })();
      // Android in-app browsers (Instagram, Facebook...) apply the phone's
      // font-size setting as text zoom: every font size is scaled, vw
      // lengths are not, so the vw-sized hero word stops fitting its box.
      // Measure the zoom (a 100px line renders at 100 x zoom) and expose
      // its inverse as --tz for display type that must fit the layout.
      (function () {
        var root = document.documentElement;
        var probe = document.createElement('div');
        probe.style.cssText = 'position:absolute;top:0;left:0;visibility:hidden;pointer-events:none;font-size:100px;line-height:1;margin:0;padding:0;border:0';
        probe.textContent = 'X';
        root.appendChild(probe);
        var zoom = probe.getBoundingClientRect().height / 100;
        root.removeChild(probe);
        if (zoom > 0.3 && Math.abs(zoom - 1) > 0.01) root.style.setProperty('--tz', String(1 / zoom));
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <!-- Fonts: preconnect + preload stylesheet for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <!-- Hero images (largest paint) -->
    <link rel="preload" as="image" href="/hero/desktop_background.webp" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/hero/desktop_nikhil.webp" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/hero/mobile_background.webp" media="(max-width: 767px)" />
    <link rel="preload" as="image" href="/hero/mobile_nikhil_portrait_vertical_4x5.webp" media="(max-width: 767px)" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
